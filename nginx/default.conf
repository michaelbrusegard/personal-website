# Replaces the image's default server. The image's nginx.conf already puts the
# pid file and every *_temp_path under /tmp, so this runs with a read-only root
# filesystem as long as /tmp is writable.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Redirects stay relative so they keep the scheme and host of the gateway.
    absolute_redirect off;

    # Text and models are precompressed with gzip -k during the image build;
    # anything else small and textual is compressed on the fly.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        text/css
        text/plain
        text/xml;

    error_page 404 /404.html;

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }

    # Content-hashed build output, including the fonts under /_next/static/media.
    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The dog model is ~48 MB and not content-hashed: cache for a day and let
    # clients revalidate against the ETag afterwards.
    location ^~ /models/ {
        types {
            model/gltf-binary glb;
        }
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        try_files $uri =404;
    }

    location ~* \.webmanifest$ {
        types {
            application/manifest+json webmanifest;
        }
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location ~* \.(?:ico|png|jpe?g|webp|avif|gif|svg|pdf)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
}
