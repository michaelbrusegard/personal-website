name: Image

'on':
  push:
    branches:
      - main
    # The digest bump below only touches deploy/, so it doesn't rebuild.
    paths-ignore:
      - deploy/**
  pull_request:
    paths-ignore:
      - deploy/**

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_REF: ghcr.io/michaelbrusegard/personal-website

jobs:
  build-and-publish:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.event_name == 'push'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_REF }}:main
            ${{ env.IMAGE_REF }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Sync main before digest update
        if: github.event_name == 'push'
        run: git pull --rebase origin main

      - name: Update image reference
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          GIT_SHA: ${{ github.sha }}
          IMAGE_REF: ${{ env.IMAGE_REF }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("deploy/helm-release.yaml")
          image_ref = os.environ["IMAGE_REF"]
          content = path.read_text()
          # app-template takes the image as repository/tag/digest, which renders
          # as <IMAGE_REF>:sha-<commit>@<digest>.
          updated, replacements = re.subn(
              rf"(?m)^(?P<indent>[ \t]*)repository: {re.escape(image_ref)}\n"
              r"(?P=indent)tag: .*\n"
              r"(?:(?P=indent)digest: .*\n)?",
              lambda m: (
                  f"{m['indent']}repository: {image_ref}\n"
                  f"{m['indent']}tag: sha-{os.environ['GIT_SHA']}\n"
                  f"{m['indent']}digest: {os.environ['DIGEST']}\n"
              ),
              content,
          )
          if replacements != 1:
              raise SystemExit("Failed to update image reference")
          path.write_text(updated)
          PY

      - name: Commit image digest update
        if: github.event_name == 'push'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if git diff --quiet -- deploy/helm-release.yaml; then
            exit 0
          fi

          git add deploy/helm-release.yaml
          git commit -m "chore(deploy): update image digest [skip ci]"
          git pull --rebase origin main
          git push
