apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: personal-website
  namespace: personal-website
spec:
  interval: 1h
  serviceAccountName: deployer
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      main:
        type: deployment
        replicas: 1
        strategy: RollingUpdate
        pod:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            # uid/gid of the nginx user in nginxinc/nginx-unprivileged
            runAsUser: 101
            runAsGroup: 101
            fsGroup: 101
            seccompProfile:
              type: RuntimeDefault
        containers:
          main:
            # .github/workflows/image.yaml rewrites tag to sha-<commit> and adds
            # the image digest after each build on main.
            image:
              repository: ghcr.io/michaelbrusegard/personal-website
              tag: sha-d5b9b028df93f1730710609553114333fee6c969
              digest: sha256:1871d44ad36d1513cf321fe89601fe84574a7eac58b313345d715a07880ba722
              pullPolicy: IfNotPresent
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8080
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8080
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    service:
      main:
        controller: main
        forceRename: personal-website
        ports:
          http:
            port: 8080
    route:
      main:
        parentRefs:
          - name: public
            namespace: gateway
            sectionName: https
        hostnames:
          - old.michaelbrusegard.com
        rules:
          - backendRefs:
              - identifier: main
                port: 8080
    persistence:
      tmp:
        type: emptyDir
        sizeLimit: 64Mi
        globalMounts:
          - path: /tmp
