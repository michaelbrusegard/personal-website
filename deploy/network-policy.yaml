apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: personal-website
  namespace: personal-website
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: personal-website
      app.kubernetes.io/instance: personal-website
  ingress:
    # Kubelet HTTP probes and node-forwarded LB traffic
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Gateway API traffic (public gateway)
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Uptime-kuma monitoring
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: uptime-kuma
            k8s:app: uptime-kuma
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  # DNS only; nginx serves static files and needs no other egress.
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
